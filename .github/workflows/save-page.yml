name: Save Webpage Snapshot

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  save-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Create folders
        run: mkdir -p snapshots data

      - name: Save raw HTML snapshot
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          curl -sL "https://amiawhale.com/hbar" -o "snapshots/hbar_$TIMESTAMP.html"

      - name: Extract HBAR data into CSV
        run: |
          python3 << 'EOF'
          import re
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime, timezone
          import os

          url = "https://amiawhale.com/hbar"
          resp = requests.get(url, headers={"User-Agent": "Mozilla/5.0"})
          soup = BeautifulSoup(resp.text, "html.parser")
          page_text = soup.get_text("\n")

          tables = soup.find_all("table")
          print(f"Found {len(tables)} table(s) on page")

          target_table = None
          held_idx = wallets_idx = None

          for t_i, table in enumerate(tables):
              rows = table.find_all("tr")
              if not rows:
                  continue
              headers = [c.get_text(strip=True) for c in rows[0].find_all(["th", "td"])]
              print(f"Table {t_i} headers: {headers}")

              h_idx = w_idx = None
              for i, h in enumerate(headers):
                  hl = h.lower()
                  if "held" in hl:
                      h_idx = i
                  if "wallet" in hl:
                      w_idx = i

              if h_idx is not None and w_idx is not None:
                  target_table = table
                  held_idx, wallets_idx = h_idx, w_idx
                  break

          if target_table is None:
              raise SystemExit("Could not find a table with 'Held' and 'Wallet' columns. See printed headers above.")

          rows = target_table.find_all("tr")
          held = []
          for row in rows[1:]:
              cols = [c.get_text(strip=True) for c in row.find_all("td")]
              if len(cols) <= max(held_idx, wallets_idx):
                  continue
              # Strip " HBAR" suffix and remove thousand-separator commas
              value = cols[held_idx].replace(" HBAR", "").replace(",", "")
              held.append(value)

          print(f"Extracted held: {held}")

          price_match = re.search(r"HBAR Price\s*\$([0-9.]+)", page_text)
          price = price_match.group(1) if price_match else "N/A"
          print(f"Extracted price: {price}")

          date_only = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          tiers = ["Kraken", "Blue Whale", "Whale", "Shark", "Dolphin", "Fish", "Jellyfish", "Shrimp"]

          filename = "data/hbar_held_history.csv"
          is_new = not os.path.exists(filename)

          with open(filename, "a") as f:
              if is_new:
                  f.write("Date,HBAR Price (USD)," + ",".join(tiers) + "\n")
              f.write(date_only + "," + price + "," + ",".join(held) + "\n")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/ data/
          git commit -m "Snapshot + data update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push
