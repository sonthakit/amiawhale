name: Save Webpage Snapshot

on:
  schedule:
    - cron: '0 */12 * * *'  # runs every 12 hours
  workflow_dispatch:  # lets you trigger manually too

jobs:
  save-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create snapshot folder
        run: mkdir -p snapshots

      - name: Save HTML with timestamp
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          curl -sL "https://amiawhale.com/hbar" -o "snapshots/hbar_$TIMESTAMP.html"

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git commit -m "Snapshot $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
