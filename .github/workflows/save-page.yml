name: Save Webpage Snapshot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  save-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Create folders
        run: mkdir -p snapshots data

      - name: Fetch page, compare, and save if changed
        run: |
          python3 << 'EOF'
          import re
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime, timezone
          import os

          url = "https://amiawhale.com/hbar"
          resp = requests.get(url, headers={"User-Agent": "Mozilla/5.0"})
          html_text = resp.text
          soup = BeautifulSoup(html_text, "html.parser")
          page_text = soup.get_text("\n")

          tables = soup.find_all("table")
          print(f"Found {len(tables)} table(s) on page")

          target_table = None
          held_idx = wallets_idx = None

          for t_i, table in enumerate(tables):
              rows = table.find_all("tr")
              if not rows:
                  continue
              headers = [c.get_text(strip=True) for c in rows[0].find_all(["th", "td"])]
              print(f"Table {t_i} headers: {headers}")

              h_idx = w_idx = None
              for i, h in enumerate(headers):
                  hl = h.lower()
                  if "held" in hl:
                      h_idx = i
                  if "wallet" in hl:
                      w_idx = i

              if h_idx is not None and w_idx is not None:
                  target_table = table
                  held_idx, wallets_idx = h_idx, w_idx
                  break

          if target_table is None:
              raise SystemExit("Could not find a table with 'Held' and 'Wallet' columns. See printed headers above.")

          rows = target_table.find_all("tr")
          held = []
          for row in rows[1:]:
              cols = [c.get_text(strip=True) for c in row.find_all("td")]
              if len(cols) <= max(held_idx, wallets_idx):
                  continue
              value = cols[held_idx].replace(" HBAR", "").replace(",", "")
              held.append(value)

          print(f"Extracted held: {held}")

          price_match = re.search(r"HBAR Price\s*\$([0-9.]+)", page_text)
          price = price_match.group(1) if price_match else "N/A"
          print(f"Extracted price: {price}")

          now = datetime.now(timezone.utc)
          date_only = now.strftime("%Y-%m-%d")
          timestamp_full = now.strftime("%Y-%m-%d_%H-%M-%S")
          tiers = ["Kraken", "Blue Whale", "Whale", "Shark", "Dolphin", "Fish", "Jellyfish", "Shrimp"]

          csv_filename = "data/hbar_held_history.csv"
          is_new = not os.path.exists(csv_filename)

          # --- Check if held data matches the last saved row (ignore Date and Price) ---
          should_write = True
          if not is_new:
              with open(csv_filename, "r") as f:
                  lines = [line.rstrip("\n") for line in f if line.strip()]
              if len(lines) > 1:
                  last_row = lines[-1].split(",")
                  last_held = last_row[2:]
                  if last_held == held:
                      should_write = False
                      print("Data unchanged from previous entry — skipping save.")

          if should_write:
              # Save CSV row
              with open(csv_filename, "a") as f:
                  if is_new:
                      f.write("Date,HBAR Price (USD)," + ",".join(tiers) + "\n")
                  f.write(date_only + "," + price + "," + ",".join(held) + "\n")
              print("New CSV row written.")

              # Save HTML snapshot
              html_filename = f"snapshots/hbar_{timestamp_full}.html"
              with open(html_filename, "w") as f:
                  f.write(html_text)
              print(f"HTML snapshot saved: {html_filename}")
          else:
              print("No new row or snapshot saved (duplicate data).")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/ data/
          git commit -m "Snapshot + data update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push
